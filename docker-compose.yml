version: '3.8'

services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: fittrack-postgres
    restart: always
    environment:
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: fittrack_secure_password_2026
      POSTGRES_DB: fittrack_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fittrack -d fittrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FitTrack Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fittrack-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://fittrack:fittrack_secure_password_2026@postgres:5432/fittrack_db?schema=public
      JWT_SECRET: fittrack-production-jwt-secret-docker-deployment-key
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLIENT_URL: http://localhost:5173
    ports:
      - '5000:5000'

volumes:
  postgres_data:
